name: daily-demo

# Tác vụ demo mốc Ngày 1: bù hàng đợi duyệt bằng mục thử.
# ĐÃ TẮT LỊCH: hệ thống thật đã chạy (nạp CV, chấm, phỏng vấn, marketing), không
# cần sinh mục demo nữa. Giữ workflow_dispatch để chạy tay khi cần diễn thử.
on:
  workflow_dispatch: {}

# Không chạy chồng lượt.
concurrency:
  group: daily-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # cần Node >= 22 vì @supabase/supabase-js dùng WebSocket có sẵn, Node 20 chưa bật mặc định

      - name: Cài phụ thuộc
        run: npm install

      - name: Chạy tác vụ demo
        run: node scripts/demo-approval.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
