name: daily-demo

# Tác vụ theo lịch: bù hàng đợi duyệt về mức 10 mục chờ.
# Chạy 4 giờ một lần, mọi ngày. Đây chỉ là tác vụ bù demo, hàng đợi rút chậm
# theo tốc độ người duyệt bấm, nên không cần chạy dày. Chạy thưa để tiết kiệm
# phút chạy miễn phí của repo private, dành hạn mức cho hr-intake.
# Script tự giới hạn: đủ 10 thì không thêm.
on:
  schedule:
    - cron: '0 */4 * * *'   # 4 giờ một lần, mọi ngày
  workflow_dispatch: {}

# Không chạy chồng lượt.
concurrency:
  group: daily-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # cần Node >= 22 vì @supabase/supabase-js dùng WebSocket có sẵn, Node 20 chưa bật mặc định

      - name: Cài phụ thuộc
        run: npm install

      - name: Chạy tác vụ demo
        run: node scripts/demo-approval.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
