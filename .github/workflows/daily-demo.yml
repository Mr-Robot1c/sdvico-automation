name: daily-demo

# Tác vụ theo lịch: bù hàng đợi duyệt về mức 10 mục chờ.
# Chạy 5 phút một lần, mọi ngày. Script tự giới hạn: đủ 10 thì không thêm,
# nên chạy dày không tạo rác, chỉ bù khi có mục vừa được duyệt hoặc từ chối.
# Lưu ý: 5 phút là mức dày nhất GitHub Actions cho phép với lịch cron, và
# lịch có thể bị trễ hoặc bỏ lượt khi hệ thống tải cao.
on:
  schedule:
    - cron: '*/5 * * * *'   # 5 phút một lần, mọi ngày
  workflow_dispatch: {}

# Không chạy chồng lượt.
concurrency:
  group: daily-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # cần Node >= 22 vì @supabase/supabase-js dùng WebSocket có sẵn, Node 20 chưa bật mặc định

      - name: Cài phụ thuộc
        run: npm install

      - name: Chạy tác vụ demo
        run: node scripts/demo-approval.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
