name: hr-screen

# Chấm CV tự động, chạy 30 phút một lần, mọi ngày, lệch 15 phút sau đường nạp CV.
# Ẩn danh trường nhạy cảm trước khi chấm (chống thiên vị). Máy chấm và xếp, người quyết.
# Điều cấm 2: không tự loại ứng viên. Hồ sơ chấm xong chuyển sang bước review cho người xem.
# Có thể chạy tay bằng workflow_dispatch để kiểm.
on:
  schedule:
    - cron: '15,45 * * * *'   # phút 15 và 45 mỗi giờ, lệch với hr-intake chạy phút 0 và 30
  workflow_dispatch: {}

# Không chạy chồng lượt, tránh chấm trùng một hồ sơ.
concurrency:
  group: hr-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài phụ thuộc
        run: npm install

      - name: Chấm CV
        run: node packages/hr/src/screen/run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HR_SCREEN_MODEL: ${{ secrets.HR_SCREEN_MODEL }}
