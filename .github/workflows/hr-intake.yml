name: hr-intake

# Đường nạp CV từ hộp thư, chạy 30 phút một lần, mọi ngày.
# Chỉ nạp và xếp hồ sơ vào luồng, không tự trả lời ứng viên (điều cấm 1, 2).
# Có thể chạy tay bằng workflow_dispatch để kiểm.
# Vì sao 30 phút, không phải 5 phút: repo private có hạn mức phút chạy miễn phí
# (2.000 phút/tháng). Lịch cron dày như */5 vừa bị GitHub bóp và bỏ lượt (thực tế
# chỉ nổ mỗi 40-50 phút), vừa tiêu vượt hạn mức. Lịch 30 phút được honor đáng tin
# cậy hơn và nằm gọn trong mức miễn phí. concurrency chặn chạy chồng lượt.
on:
  schedule:
    - cron: '*/30 * * * *'   # 30 phút một lần
  workflow_dispatch: {}

# Không chạy chồng lượt, tránh nạp trùng một thư khi lượt trước chưa xong.
concurrency:
  group: hr-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài phụ thuộc
        run: npm install

      - name: Nạp CV từ hộp thư
        run: node packages/hr/src/intake/run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAIL_IMAP_HOST: ${{ secrets.MAIL_IMAP_HOST }}
          MAIL_IMAP_PORT: ${{ secrets.MAIL_IMAP_PORT }}
          MAIL_IMAP_USER: ${{ secrets.MAIL_IMAP_USER }}
          MAIL_IMAP_PASSWORD: ${{ secrets.MAIL_IMAP_PASSWORD }}
          MAIL_IMAP_MAILBOX: ${{ secrets.MAIL_IMAP_MAILBOX }}
          MAIL_INTAKE_ALLOWED_SENDERS: ${{ secrets.MAIL_INTAKE_ALLOWED_SENDERS }}
          CV_BUCKET: ${{ secrets.CV_BUCKET }}
          HR_RETENTION_MONTHS: ${{ secrets.HR_RETENTION_MONTHS }}
