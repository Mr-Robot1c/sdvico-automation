name: Deploy — Approval UI lên Vercel

on:
  push:
    branches: [main]
    paths:
      - 'apps/approval-ui/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Vercel Production Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Lấy Vercel Org ID từ token
        run: |
          ORG_ID=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user | jq -r '.user.id')
          echo "VERCEL_ORG_ID=$ORG_ID" >> "$GITHUB_ENV"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy lên Vercel
        run: npx vercel --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
