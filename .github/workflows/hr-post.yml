name: HR — Đăng tin tuyển dụng Facebook

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chạy thử, chỉ in, không đăng lên Facebook (true/false)'
        required: false
        default: 'false'

jobs:
  cleanup:
    name: Dọn bài cũ vi phạm giới hạn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Dọn bài Facebook vượt giới hạn
        run: node packages/hr/src/post/cleanup-facebook.mjs --live
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: v21.0
          HR_FB_MAX_POSTS: 20

  publish:
    name: Đăng tin Facebook
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Chạy worker đăng Facebook
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node packages/hr/src/post/publish-facebook.mjs
          else
            node packages/hr/src/post/publish-facebook.mjs --live
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: v21.0
          HR_FB_MAX_PER_DAY: 50
