name: HR — Đăng tin tuyển dụng Facebook

on:
  schedule:
    # Mỗi 5 phút, 6h–22h giờ Hà Nội (ICT = UTC+7): 23:00–15:00 UTC
    - cron: '*/5 23-15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chạy thử, chỉ in, không đăng lên Facebook (true/false)'
        required: false
        default: 'false'

jobs:
  publish:
    name: Đăng tin Facebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Chạy worker đăng Facebook
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node packages/hr/src/post/publish-facebook.mjs
          else
            node packages/hr/src/post/publish-facebook.mjs --live
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: v21.0
          HR_FB_MAX_PER_DAY: 3
