name: Cron 30 phút - số liệu + sinh nội dung

# GỌI 2 endpoint trên Vercel mỗi 30 phút (cron Vercel Hobby không chạy được lịch dưới 1 ngày):
#  1) /api/mkt-metrics-pull  - cập nhật mkt_metrics + học tri thức + sinh kế hoạch theo lịch.
#  2) /api/rotate            - sinh bài A/B chờ duyệt. Route có GUARD 1 lần/ngày (VN) nên gọi 30
#     phút/lần vẫn chỉ tạo 1 đợt bài mỗi ngày; đây là LƯỚI AN TOÀN cho cron Vercel /api/rotate hay
#     bị trượt (19/8: cron Vercel trượt cả ngày, không ai biết vì route im lặng — nay có run_log).
# Cả 2 bảo vệ bằng CRON_SECRET (đặt cùng giá trị trên GitHub secret + Vercel env production).

on:
  schedule:
    - cron: '*/30 * * * *' # mỗi 30 phút
  workflow_dispatch:
    inputs:
      force_rotate:
        description: 'Ép sinh thêm 1 đợt bài A/B (bỏ qua guard 1 lần/ngày). true/false.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force_plan:
        description: 'Ép BOSS sinh lại kế hoạch ngay + áp dụng (sau khi đổi mục tiêu/sản phẩm tập trung).'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: mkt-metrics-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo số liệu Facebook + học tri thức + kế hoạch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE_PLAN: ${{ github.event.inputs.force_plan }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Thieu CRON_SECRET"; exit 1; fi
          Q=""
          if [ "$FORCE_PLAN" = "true" ]; then Q="?plan=1"; echo "FORCE PLAN: sinh ke hoach ngay + ap dung"; fi
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://sdvico-mktit.vercel.app/api/mkt-metrics-pull$Q")
          echo "metrics-pull HTTP $code"
          head -c 800 /tmp/resp.json; echo
          test "$code" = "200"
      - name: Sinh nội dung 2 slot/ngày (sang 8h + chieu 13h VN) - luoi an toan neu cron Vercel truot
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE_ROTATE: ${{ github.event.inputs.force_rotate }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Thieu CRON_SECRET"; exit 0; fi
          H=$(TZ=Asia/Ho_Chi_Minh date +%H); H=$((10#$H))
          call_rotate() {
            local Q="$1"; local NAME="$2"
            local code=$(curl -s -o /tmp/rot_${NAME}.json -w "%{http_code}"  -H "Authorization: Bearer $CRON_SECRET"  "https://sdvico-mktit.vercel.app/api/rotate$Q")
            echo "rotate $NAME HTTP $code"
            head -c 500 /tmp/rot_${NAME}.json; echo
          }
          M=$(TZ=Asia/Ho_Chi_Minh date +%M); M=$((10#$M))
          if [ "$FORCE_ROTATE" = "true" ]; then
            call_rotate "?force=1" "force"
          else
            if [ $H -ge 7 ]; then call_rotate "?slot=sang" "sang"; fi
            # Slot chieu tu 12h30 (truoc: H>=12 lam luoi goi tu 12h00 -> bai chieu sinh som
            # 28 phut, user bat 21/8 "bai B ra 12:02").
            if [ $H -gt 12 ] || { [ $H -eq 12 ] && [ $M -ge 30 ]; }; then call_rotate "?slot=chieu" "chieu"; fi
          fi
