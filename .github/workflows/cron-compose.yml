name: Cron — Soạn bài tuyển dụng

on:
  workflow_dispatch:

jobs:
  compose:
    name: Gọi endpoint soạn bài
    runs-on: ubuntu-latest
    steps:
      - name: Gọi /api/cron/compose
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_URL/api/cron/compose")
          echo "HTTP $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
