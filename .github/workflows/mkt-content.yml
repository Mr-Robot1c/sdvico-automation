name: Sinh nội dung marketing

# Bốc từ khóa, sinh 3 định dạng (website, Facebook, video), đẩy vào hàng đợi duyệt.
# KHÔNG đăng gì. Người duyệt bấm Duyệt thì worker mới đăng.
#
# LỊCH: mỗi ngày 1 lần lúc 1h UTC (8h VN). Đã giãn từ '*/5' (thử nghiệm, quá dày, mỗi lần còn
# npm install nên tốn nhiều phút Actions của repo private, mỗi tháng chỉ 2.000 phút). Cần thêm
# bài thì bấm "Run workflow" chạy tay, hoặc tăng tần suất lại ở dòng cron dưới.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

# Không chạy chồng nếu lần trước chưa xong.
concurrency:
  group: mkt-content
  cancel-in-progress: false

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Sinh 1 từ khóa x 3 định dạng
        run: node packages/marketing/src/run-content.mjs 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MKT_MODEL: ${{ secrets.MKT_MODEL }}
