name: Sinh nội dung marketing

# Bốc từ khóa, sinh 3 định dạng (website, Facebook, video), đẩy vào hàng đợi duyệt.
# KHÔNG đăng gì. Người duyệt bấm Duyệt thì worker mới đăng.
#
# TẮT LỊCH 21/8/2026: đây là ĐƯỜNG SINH BÀI CŨ theo từ khóa (1 từ khóa x 3 định dạng), đã bị
# thay bằng vòng xoay /api/rotate (2 slot/ngày, theo kế hoạch BOSS). Trước nó "im" vì cạn từ
# khóa; 20/8 kho mkt_keywords được nạp 152 mục nên nó SỐNG DẬY sinh 3 bài trùng lúc 9h22 —
# user bắt lỗi. Giữ workflow_dispatch để chạy tay khi thật sự cần bài theo từ khóa.

on:
  workflow_dispatch:

# Không chạy chồng nếu lần trước chưa xong.
concurrency:
  group: mkt-content
  cancel-in-progress: false

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Sinh 1 từ khóa x 3 định dạng
        run: node packages/marketing/src/run-content.mjs 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MKT_MODEL: ${{ secrets.MKT_MODEL }}
